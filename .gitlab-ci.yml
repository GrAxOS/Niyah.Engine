default:
  image: python:3.13-slim

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  PYTHONUNBUFFERED: "1"

stages:
  - analyze
  - deploy

khz-realtime-analysis:
  stage: analyze
  script:
    - python scripts/build_khz_realtime_pages.py --verify-only
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - public/khz_realtime_bundle.json
      - public/khz_realtime_snapshot.json
      - public/logs/
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy-pages:
  stage: deploy
  needs:
    - job: khz-realtime-analysis
      artifacts: true
  script:
    - python scripts/build_khz_realtime_pages.py
    - test -s public/index.html
    - test -s public/khz_realtime_bundle.json
    - test -s public/khz_realtime_snapshot.json
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production

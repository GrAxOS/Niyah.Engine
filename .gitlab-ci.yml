include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - publish

variables:
  GIT_DEPTH: "0"
  SECRET_DETECTION_HISTORIC_SCAN: "true"
  SAST_EXCLUDED_PATHS: "audits,normalized,public,backups"

v2_contract_audit:
  stage: validate
  image: python:3.12-alpine
  script:
    - python scripts/ci_v2_contract_audit.py
  artifacts:
    when: always
    paths:
      - audits/
      - public/
    reports:
      junit: audits/v2_contract_junit.xml
    expire_in: 30 days

pages:
  stage: publish
  image: alpine:latest
  needs:
    - job: v2_contract_audit
      artifacts: true
  script:
    - test -f public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
